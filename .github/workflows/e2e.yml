on:
  push:
    branches:
      - main
    paths:
      - 'R/**'
      - 'inst/**'
      - 'examples/**'
      - 'tests/e2e/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/e2e.yml'
  # No path filter on PRs: the e2e checks are required on main, and a PR that touches none of the paths above
  # would get no e2e checks at all and wait for them forever.
  pull_request:

name: e2e

permissions:
  contents: read

jobs:
  e2e:
    uses: Appsilon/shiny.playwright/.github/workflows/e2e.yml@v0.2.0
    with:
      shiny-oldest: '1.7.5.1'
